name: Publish to GitHub Pages

on:
  schedule:
    # arXiv refreshes its feeds at midnight US Eastern, Monday to Friday.
    - cron: "30 5 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to save the author index back to the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Fetch the latest papers and build the site
        run: python3 build_site.py --out _site --previous "${{ steps.pages.outputs.base_url }}"
      - name: Save the author index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/authors.json
          if ! git diff --cached --quiet; then
            git commit -m "Update author index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
