name: Publish to GitHub Pages

on:
  schedule:
    # arXiv posts new papers at 20:00 US Eastern, Sunday to Thursday, and refreshes its feeds
    # around midnight Eastern. Check every 10 minutes through that window (00:00-07:59 UTC covers
    # both EST and EDT) and rebuild as soon as a new announcement shows up.
    - cron: "*/10 0-7 * * 1-5"
    # One midday check in case the overnight ones were skipped or arXiv ran late.
    - cron: "17 12 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to save the author index back to the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Look for a new arXiv announcement
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"   # code changes and manual runs always rebuild
          else
            python3 check_arxiv.py --site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Fetch the latest papers and build the site
        run: python3 build_site.py --out _site --previous "${{ steps.pages.outputs.base_url }}"
      - name: Save the author index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/authors.json
          if ! git diff --cached --quiet; then
            git commit -m "Update author index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
